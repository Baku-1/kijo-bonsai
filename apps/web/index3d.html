<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kijo — 3D Bonsai Care</title>
  <style>
    :root { --panel: #232719; --edge: #3a4028; --accent: #7ba05b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #1a1d16; color: #cfd8c3; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 8px 16px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; }
    #meta { font-size: 12px; opacity: .8; }
    #meta.moisture-bad { color: #e0a050; opacity: 1; }
    #layout { display: flex; gap: 12px; padding: 0 16px 12px; flex: 1; min-height: 0; }
    #app { flex: 1; min-width: 0; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; position: relative; }
    #app canvas { display: block; }
    #hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; opacity: .65; pointer-events: none; z-index: 2; }
    #panel { width: 250px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; overflow-y: auto; }
    fieldset { border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; margin: 0; background: var(--panel); }
    legend { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
    button { background: #2e3520; color: #cfd8c3; border: 1px solid var(--edge); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #141710; }
    input, select { background: #161a10; color: #cfd8c3; border: 1px solid var(--edge); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
    input[type=number] { width: 90px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; }
    #stat-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #stat-table td { padding: 2px 0; }
    #stat-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    #voxel-count { font-size: 11px; opacity: .7; }
    #fert-status { font-size: 11px; color: #e0c060; min-height: 14px; }
    textarea { width: 100%; height: 110px; background: #161a10; color: #cfd8c3; border: 1px solid var(--edge); border-radius: 6px; font-family: monospace; font-size: 10px; resize: vertical; }
    a { color: var(--accent); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>Kijo — bonsai care (3D)</h1>
    <span id="meta"></span>
  </header>
  <div id="layout">
    <div id="app"><span id="hint"></span></div>
    <div id="panel">
      <fieldset>
        <legend>Tree</legend>
        <div class="row">
          <label for="seed">seed</label>
          <input id="seed" type="number" value="464497" />
          <select id="species">
            <option value="hardwood">hardwood</option>
            <option value="evergreen" selected>evergreen</option>
            <option value="tropical">tropical</option>
          </select>
        </div>
        <div class="row" style="margin-top:6px">
          <button id="btn-new" class="grow">New tree</button>
          <a href="index.html">2D view</a>
        </div>
      </fieldset>
      <fieldset>
        <legend>Care</legend>
        <div class="row">
          <button id="btn-water" class="grow">Water</button>
          <button id="btn-fertilize" class="grow">Fertilize</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button id="btn-prune" class="grow">Prune...</button>
          <button id="btn-rotate" class="grow">Rotate 90&#176;</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button id="btn-wire" class="grow">Wire...</button>
        </div>
        <div id="wire-controls" style="display:none; margin-top:6px; border-top:1px solid var(--edge); padding-top:6px">
          <div id="wire-branch-info" style="font-size:11px; opacity:.7; margin-bottom:4px">&#8212;</div>
          <div class="row">
            <label for="wire-angle" style="font-size:11px; white-space:nowrap">Bend &#916;</label>
            <input id="wire-angle" type="range" min="-45" max="45" value="0" class="grow" style="cursor:pointer" />
            <span id="wire-angle-label" style="font-size:12px; min-width:38px; text-align:right">0&#176;</span>
          </div>
          <div class="row" style="margin-top:4px">
            <button id="btn-wire-apply" class="grow">Apply</button>
            <button id="btn-wire-remove">Remove</button>
          </div>
        </div>
        <!-- Twine controls (SCULPT-ADD 2026-08-29) -->
        <div class="row" style="margin-top:6px">
          <button id="btn-twine" class="grow">Twine...</button>
        </div>
        <div id="twine-controls" style="display:none; margin-top:6px; border-top:1px solid var(--edge); padding-top:6px">
          <div id="twine-branch-info" style="font-size:11px; opacity:.7; margin-bottom:4px">&#8212;</div>
          <div class="row">
            <label for="twine-angle" style="font-size:11px; white-space:nowrap">Bend &#916;</label>
            <input id="twine-angle" type="range" min="-28" max="28" value="0" class="grow" style="cursor:pointer" />
            <span id="twine-angle-label" style="font-size:12px; min-width:38px; text-align:right">0&#176;</span>
          </div>
          <div class="row" style="margin-top:4px">
            <button id="btn-twine-apply" class="grow">Apply</button>
            <button id="btn-twine-remove">Remove</button>
          </div>
        </div>
        <!-- Weight controls (SCULPT-ADD 2026-08-29) -->
        <div class="row" style="margin-top:6px">
          <button id="btn-weight" class="grow">Weight...</button>
        </div>
        <div id="weight-controls" style="display:none; margin-top:6px; border-top:1px solid var(--edge); padding-top:6px">
          <div id="weight-branch-info" style="font-size:11px; opacity:.7; margin-bottom:4px">&#8212;</div>
          <div class="row">
            <label for="weight-count" style="font-size:11px; white-space:nowrap">Bags</label>
            <select id="weight-count" style="width:60px">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
            <span id="weight-angle-preview" style="font-size:11px; opacity:.7">+7&#176; down</span>
          </div>
          <div class="row" style="margin-top:4px">
            <button id="btn-weight-apply" class="grow">Apply</button>
            <button id="btn-weight-remove">Remove</button>
          </div>
        </div>
        <!-- Jin controls (SCULPT-ADD 2026-08-29) -->
        <div class="row" style="margin-top:6px">
          <button id="btn-jin" class="grow">Jin...</button>
        </div>
        <div id="jin-controls" style="display:none; margin-top:6px; border-top:1px solid var(--edge); padding-top:6px">
          <div id="jin-branch-info" style="font-size:11px; opacity:.7; margin-bottom:4px">&#8212;</div>
          <div class="row">
            <label for="jin-segment" style="font-size:11px; white-space:nowrap">Segment</label>
            <input id="jin-segment" type="number" min="0" value="0" style="width:60px" />
            <span id="jin-cost-label" style="font-size:11px; color:#e0c060">Cost: 1 jin</span>
          </div>
          <div class="row" style="margin-top:4px">
            <button id="btn-jin-apply" class="grow" style="background:#4a2020; border-color:#c06040">Apply (irreversible)</button>
          </div>
          <div id="jin-stub-warning" style="font-size:10px; color:#e07040; margin-top:2px">Phase 1: jin engine stub — will error until Phase 2</div>
        </div>
        <!-- Landscape controls (SCULPT-ADD 2026-08-29) — NOT branch-targeted -->
        <div class="row" style="margin-top:6px">
          <button id="btn-landscape" class="grow">Landscape...</button>
        </div>
        <div id="landscape-controls" style="display:none; margin-top:6px; border-top:1px solid var(--edge); padding-top:6px">
          <div class="row">
            <label for="landscape-type" style="font-size:11px">Element</label>
            <select id="landscape-type">
              <option value="rock">Rock</option>
              <option value="moss">Moss</option>
              <option value="pot">Pot</option>
            </select>
          </div>
          <div class="row" style="margin-top:4px">
            <label style="font-size:11px">Position</label>
            <input id="landscape-x" type="number" min="0" max="255" value="128" style="width:50px" placeholder="x" />
            <input id="landscape-y" type="number" min="0" max="255" value="38" style="width:50px" placeholder="y" />
            <input id="landscape-z" type="number" min="0" max="255" value="128" style="width:50px" placeholder="z" />
          </div>
          <div class="row" style="margin-top:4px">
            <button id="btn-landscape-apply" class="grow">Place element</button>
          </div>
        </div>
        <div class="row" style="margin-top:6px">
          <button id="btn-day" class="grow">Advance day &#9654;</button>
          <span>&#215;</span>
          <input id="days-multi" type="number" value="1" min="1" max="30" style="width:56px" />
        </div>
        <div id="fert-status"></div>
      </fieldset>
      <fieldset>
        <legend>Derived stats (live)</legend>
        <div id="voxel-count"></div>
        <table id="stat-table"></table>
        <div class="row" style="margin-top:6px">
          <button id="btn-ghost" class="grow">Ideal-form hint</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>Export fighter</legend>
        <div class="row">
          <button id="btn-export" class="grow">Generate fighter JSON</button>
          <button id="btn-copy">Copy</button>
        </div>
        <textarea id="export-out" readonly placeholder="fighter JSON appears here -- drop into res://fixtures/ to fight with it"></textarea>
      </fieldset>
    </div>
  </div>
  <script type="module" src="/src/main3d.ts"></script>
</body>
</html>
