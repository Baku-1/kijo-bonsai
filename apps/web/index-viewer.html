<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kijonsai Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
      canvas { display: block; width: 100%; height: 100%; }
      #status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ccc;
        font-family: sans-serif;
        font-size: 16px;
        pointer-events: none;
      }
    </style>
    <!--
      @lookingglass/webxr v0.6.0 — must load BEFORE viewer.ts so the polyfill
      patches navigator.xr before the module runs isSessionSupported.
      UMD bundle registers window.LookingGlassWebXRPolyfill automatically.
    -->
    <script src="https://unpkg.com/@lookingglass/webxr@0.6.0/dist/bundle/lookingglass-webxr.min.js"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="status">Loading...</div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
