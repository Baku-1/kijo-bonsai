# Supabase Edge Functions config for the Kijo project (ref: xutjubkaskwchzyzwryk).
# Only derive-stats is listed here. It mirrors get-tree's public stance:
# ownership is enforced upstream at discovery/list-trees, and the underlying
# care log is already public via get-tree -- so the function must NOT require
# a JWT.
project_id = "xutjubkaskwchzyzwryk"

# wallet-auth-nonce is a bootstrap endpoint like wallet-auth: the client calls it
# to fetch a nonce BEFORE it has any JWT, so it must not require one.
# Security comes from single-use 5-minute nonces + rate limiting, not JWT.
[functions.wallet-auth-nonce]
verify_jwt = false

[functions.derive-stats]
verify_jwt = false
