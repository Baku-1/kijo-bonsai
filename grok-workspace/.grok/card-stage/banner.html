<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Cormorant Garamond";
    font-style: normal;
    font-weight: 600;
    src: url("./cormorant-600.ttf") format("truetype");
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 264px;
    overflow: hidden;
    background: #161310;
  }
  .bg {
    position: absolute;
    inset: 0;
    background: url("./banner-bg.jpg") center / cover no-repeat;
  }
  .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      rgba(22, 19, 16, 0.58) 0%,
      rgba(22, 19, 16, 0.28) 38%,
      rgba(22, 19, 16, 0.04) 62%,
      rgba(22, 19, 16, 0.12) 100%
    );
  }
  .lockup {
    position: absolute;
    left: 48px;
    top: 28px;
    width: 520px;
    text-align: left;
    color: #efe6d4;
    text-shadow:
      0 1px 0 rgba(26, 22, 18, 0.4),
      0 6px 18px rgba(22, 19, 16, 0.9);
  }
  h1 {
    margin: 0;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 54px;
    line-height: 0.9;
    letter-spacing: 0.16em;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="lockup">
    <h1>BONSAI<br />ATELIER</h1>
  </div>
</body>
</html>
